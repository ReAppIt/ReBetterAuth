name: re_better_auth
description: "Flutter port of the official Better Auth Expo client: secure cookie storage, social sign-in through an auth session, and a cached, auto-refreshing session."
version: 0.1.1
repository: https://github.com/ReAppIt/ReBetterAuth
issue_tracker: https://github.com/ReAppIt/ReBetterAuth/issues
topics:
  - authentication
  - better-auth
  - oauth
  - session
  - flutter

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

platforms:
  android:
  ios:

dependencies:
  clock: ^1.1.1
  connectivity_plus: ^7.0.0
  dio: ^5.8.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  flutter_web_auth_2: ^5.1.0
  flutter_web_auth_2_platform_interface: ^5.0.0
  http_parser: ^4.1.0
  logging: ^1.3.0
  meta: ^1.15.0

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
